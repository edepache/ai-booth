function titleBlock(title){return`<div class="titleBlock"><div class="eyebrow">${esc(BOOTH_DATA.meta.event)}</div><h2 class="pageTitle">${esc(title)}</h2></div>`}
function render(){document.documentElement.lang=state.lang; const r={attract, path, industry, usecase, result}[state.screen]; r();}
function attract(){chrome(`<div class="kicker">${ui('attract_kicker')}</div><h1>${ui('attract_title')}</h1><p class="subtitle">${ui('attract_sub')}</p><div class="ctaRow"><button class="cta tap" data-action="start">${ui('attract_cta')}</button><button class="ghost tap" data-action="pillars">${ui('btn_explore_pillars')}</button></div>`)}
function path(){chrome(`${titleBlock(ui('path_title'))}<div class="grid two"><article class="card pathCard tap" style="--accent:#16BDEB;--i:0" data-action="path" data-path="experienced"><div class="icon">${icon('radar')}</div><h2>${ui('path_exp_title')}</h2><p>${ui('path_exp_desc')}</p><div class="num">01</div></article><article class="card pathCard tap" style="--accent:#FF007F;--i:1" data-action="path" data-path="new"><div class="icon">${icon('eye')}</div><h2>${ui('path_new_title')}</h2><p>${ui('path_new_desc')}</p><div class="num">02</div></article></div><div class="actions"><button class="btn" data-action="pillars">${ui('btn_explore_pillars')}</button></div>`,progress())}
function industry(){const cards=Object.entries(BOOTH_DATA.industries).map(([id,ind],i)=>`<article class="card industryCard tap" style="--accent:${accents[i]};--i:${i}" data-action="industry" data-id="${id}">${icon(ind.icon)}<h3>${t(ind.name)}</h3><p>${t(ind.tagline)}</p></article>`).join(''); chrome(`${titleBlock(ui('industry_title'))}<div class="grid five">${cards}</div><div class="actions"><button class="btn" data-action="back">${ui('btn_back')}</button></div>`,progress())}
function usecase(){const ind=BOOTH_DATA.industries[state.industry];const cards=ind.useCases.map((uc,i)=>`<article class="card usecaseCard tap" style="--accent:${accents[i%accents.length]};--i:${i}" data-action="usecase" data-id="${uc.id}"><h3>${t(uc.title)}</h3><p>${t(uc.desc)}</p></article>`).join('');chrome(`${titleBlock(state.path==='experienced'?ui('usecase_title'):ui('usecase_title_new'))}<div class="grid cards">${cards}</div><div class="actions"><button class="btn" data-action="back">${ui('btn_back')}</button></div>`,progress())}
function result(){const ind=BOOTH_DATA.industries[state.industry], uc=ind.useCases.find(u=>u.id===state.useCase); const pillars=uc.pillars.map(id=>{const p=BOOTH_DATA.pillars[id];return`<div class="chip" style="--pc:${p.color}" title="${esc(t(p.short))}">${icon(p.icon)}<div><b>${t(p.name)}</b><small>${t(p.short)}</small></div></div>`}).join(''); const products=uc.products.map(p=>`<span class="badge">${esc(p)}</span>`).join(''); const booths=uc.booths.map(id=>{const b=BOOTH_DATA.booths[id];return`<article class="booth"><h3>${t(b.name)}</h3><p>${t(b.focus)}</p><div class="badges">${b.products.map(p=>`<span class="badge">${esc(p)}</span>`).join('')}</div></article>`}).join(''); chrome(`<div class="result"><div class="resultHero"><div class="resultHeader"><div class="eyebrow">${t(ind.name)} · ${t(ind.tagline)}</div><h2>${t(uc.title)}</h2><p>${t(uc.desc)}</p></div><div class="callout"><h3 class="sectionTitle">${ui('result_challenge')}</h3><p>${t(uc.securityChallenge)}</p></div></div><div class="resultGrid"><section class="panel"><h3 class="sectionTitle">${ui('result_pillars')}</h3><div class="pillars">${pillars}</div></section><section class="panel reco"><h3 class="sectionTitle">${ui('result_reco')}</h3><p>${t(uc.recommendation)}</p></section><section class="panel"><h3 class="sectionTitle">${ui('result_products')}</h3><div class="badges">${products}</div></section><section class="panel booths"><h3 class="sectionTitle">${ui('result_booths')}</h3><div class="boothGrid">${booths}</div></section></div><div class="actions"><button class="btn" data-action="back">${ui('btn_back')}</button><button class="btn primary" data-action="restart">${ui('btn_restart')}</button></div></div>`,progress())}
function pillarGrid(){const cards=Object.entries(BOOTH_DATA.pillars).map(([id,p],i)=>`<article class="pillarCard tap" tabindex="0" role="button" aria-label="${esc(t(p.name))}" style="--pc:${p.color};--i:${i}" data-action="pillar-detail" data-id="${id}">${icon(p.icon)}<h3>${t(p.name)}</h3><p>${t(p.short)}</p><span class="chev" aria-hidden="true">›</span></article>`).join(''); return `<div class="overlayTop"><div><h2 class="pageTitle">${ui('pillars_title')}</h2><p class="pillarsHint">${ui('pillars_hint')}</p></div><button class="close" data-action="close">×</button></div><div class="pillarGrid">${cards}</div>`}
function pillarDetail(){const p=BOOTH_DATA.pillars[state.pillar]||Object.values(BOOTH_DATA.pillars)[0]; const products=(p.products||[]).map((prod,i)=>`<article class="pillarProduct" style="--i:${i}"><strong class="productName">${esc(prod.name)}</strong><span class="whyLabel">${ui('pillar_why')}</span><p>${esc(t(prod.why))}</p></article>`).join(''); return `<div class="overlayTop"><button class="btn pillarBack" data-action="pillar-grid">‹ ${ui('pillar_back')}</button><button class="close" data-action="close">×</button></div><section class="pillarDetail" style="--pc:${p.color}"><div class="pillarDetailHead">${icon(p.icon)}<div><div class="eyebrow">${esc(p.key)}</div><h3>${t(p.name)}</h3></div></div><p class="pillarLead">${t(p.short)}</p><h3 class="sectionTitle">${ui('pillar_products')}</h3><div class="pillarProducts">${products}</div></section>`}
function showPillars(){overlay.className='overlay open'; overlay.setAttribute('aria-hidden','false'); overlay.innerHTML=`<div class="overlayBox">${state.pillar?pillarDetail():pillarGrid()}</div>`}
function hidePillars(){state.pillar=null; overlay.className='overlay'; overlay.setAttribute('aria-hidden','true')}
function back(){if(state.screen==='result'){state.screen='usecase';state.useCase=null}else if(state.screen==='usecase'){state.screen='industry';state.industry=null}else if(state.screen==='industry'){state.screen='path';state.path=null}else state.screen='attract';render()}
document.addEventListener('click',e=>{resetIdle(); const el=e.target.closest('[data-action]'); if(!el)return; const a=el.dataset.action; if(a==='hub'){goHub();return} if(a==='lang'){state.lang=state.lang==='es'?'en':'es'; persistLang(); render(); if(overlay.classList.contains('open'))showPillars()} if(a==='start'){state.screen='path';render()} if(a==='path'){state.path=el.dataset.path;state.screen='industry';render()} if(a==='industry'){state.industry=el.dataset.id;state.screen='usecase';render()} if(a==='usecase'){state.useCase=el.dataset.id;state.screen='result';render()} if(a==='back')back(); if(a==='restart'){state.screen='attract';state.path=state.industry=state.useCase=null;render()} if(a==='pillars'){state.pillar=null;showPillars()} if(a==='pillar-detail'){state.pillar=el.dataset.id;showPillars()} if(a==='pillar-grid'){state.pillar=null;showPillars()} if(a==='close')hidePillars();});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-action="pillar-detail"]')){e.preventDefault();e.target.click()}});
let idle; function resetIdle(){clearTimeout(idle); idle=setTimeout(()=>{goHub()},90000)} ['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,resetIdle,{passive:true}));
function initCanvas(){const c=document.getElementById('network'),ctx=c.getContext('2d');let w,h,dpr,pts=[];function resize(){dpr=Math.min(devicePixelRatio||1,2);w=c.width=innerWidth*dpr;h=c.height=innerHeight*dpr;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';pts=Array.from({length:Math.min(90,Math.floor(innerWidth/18))},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.34*dpr,vy:(Math.random()-.5)*.34*dpr,r:(Math.random()*2+1)*dpr}))}function tick(){ctx.clearRect(0,0,w,h);for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1}for(let i=0;i<pts.length;i++){for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j],dx=a.x-b.x,dy=a.y-b.y,dist=Math.hypot(dx,dy);if(dist<165*dpr){ctx.globalAlpha=(1-dist/(165*dpr))*.42;ctx.strokeStyle='#16BDEB';ctx.lineWidth=1*dpr;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}}for(const p of pts){ctx.globalAlpha=.75;ctx.fillStyle=Math.random()>.5?'#16BDEB':'#3070E7';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}requestAnimationFrame(tick)}addEventListener('resize',resize);resize();tick()}
initCanvas(); render(); resetIdle();
  </script>
</body>
</html>
