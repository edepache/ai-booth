<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cisco AI Bridge · Cisco Connect Cancún 2026</title>
  <style>
    :root{--cisco-blue:#3070E7;--navy:#07182D;--dark:#0F1729;--teal:#16BDEB;--green:#22C55E;--ink:#EAF6FF;--light:#F8FAFC;--muted:#94A3B8;--glass:rgba(10,30,54,.62);--glass2:rgba(255,255,255,.08);--line:rgba(120,210,255,.22);--shadow:0 24px 90px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.12);font-family:'CiscoSans','Helvetica Neue',Helvetica,Arial,sans-serif}
    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#030B18;color:var(--ink);font-family:'CiscoSans','Helvetica Neue',Helvetica,Arial,sans-serif;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent}a{color:inherit;text-decoration:none}
    body:before{content:"";position:fixed;inset:-20%;background:radial-gradient(circle at 18% 20%,rgba(48,112,231,.42),transparent 27%),radial-gradient(circle at 80% 8%,rgba(22,189,235,.34),transparent 24%),radial-gradient(circle at 74% 76%,rgba(34,197,94,.18),transparent 28%),linear-gradient(135deg,#030813 0%,#07182D 45%,#081121 100%);z-index:-4;animation:mesh 18s ease-in-out infinite alternate}
    body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:10;opacity:.15;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:42px 42px;mask-image:radial-gradient(circle at center,#000 20%,transparent 86%)}
    @keyframes mesh{0%{filter:hue-rotate(0deg) saturate(1);transform:scale(1)}100%{filter:hue-rotate(12deg) saturate(1.25);transform:scale(1.08)}}#network{position:fixed;inset:0;z-index:-3;opacity:.82}.orb{position:fixed;border-radius:999px;filter:blur(18px);opacity:.34;z-index:-2;animation:float 10s ease-in-out infinite alternate}.orb.a{width:290px;height:290px;background:var(--teal);left:5%;bottom:8%}.orb.b{width:220px;height:220px;background:var(--cisco-blue);right:9%;top:17%;animation-delay:-3s}.orb.c{width:180px;height:180px;background:var(--green);right:30%;bottom:7%;animation-delay:-6s}@keyframes float{to{transform:translate3d(28px,-42px,0) scale(1.18)}}
    .app{position:relative;height:100%;display:flex;flex-direction:column;padding:34px clamp(28px,4vw,72px) 26px}.topbar{position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;min-height:74px;gap:20px}.brand{display:flex;align-items:center;gap:16px;font-weight:900;letter-spacing:.22em;color:#fff}.brand .word{font-size:clamp(18px,2vw,28px);color:#7DDCFF;text-shadow:0 0 24px rgba(22,189,235,.55)}.brand .stage{font-size:13px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}.lang{min-width:92px;height:64px;border:1px solid rgba(125,220,255,.32);background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.05));color:#fff;border-radius:22px;font-size:22px;font-weight:900;box-shadow:var(--shadow);cursor:pointer}.lang:active,.tap:active{transform:scale(.97)}
    .hero{position:relative;z-index:2;flex:1;display:grid;grid-template-rows:auto 1fr auto;min-height:0;padding-top:12px;animation:screenIn .45s ease-out both}@keyframes screenIn{from{opacity:0;transform:translateY(18px) scale(.988);filter:blur(7px)}to{opacity:1;transform:none;filter:none}}.hero:before{content:"";position:absolute;width:min(58vw,820px);height:min(58vw,820px);right:-8vw;top:32%;transform:translateY(-50%);border-radius:50%;background:conic-gradient(from 40deg,transparent,rgba(22,189,235,.4),transparent,rgba(48,112,231,.5),transparent);opacity:.65;animation:spin 18s linear infinite}.hero:after{content:"AI\A BRIDGE\A 2026";white-space:pre;position:absolute;right:2vw;top:35%;transform:translateY(-50%) rotate(-7deg);font-size:clamp(56px,8vw,150px);line-height:.78;font-weight:950;letter-spacing:-.07em;color:transparent;-webkit-text-stroke:1px rgba(125,220,255,.18);opacity:.9}@keyframes spin{to{transform:translateY(-50%) rotate(360deg)}}
    .center{align-self:center;position:relative;z-index:2;text-align:left;width:100%;padding-bottom:14px}.kicker{color:#7DDCFF;font-size:clamp(18px,2vw,28px);font-weight:900;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 0 26px rgba(22,189,235,.62)}h1{font-size:clamp(86px,11.4vw,210px);line-height:.78;margin:18px 0 22px;letter-spacing:-.085em;font-weight:950;max-width:1050px;background:linear-gradient(90deg,#fff 0%,#BCEEFF 36%,#16BDEB 68%,#3070E7 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 28px 80px rgba(0,200,255,.16)}.subtitle{font-size:clamp(28px,3vw,54px);line-height:1.05;color:#D6F6FF;max-width:980px;margin:0;font-weight:750;letter-spacing:-.03em}
    .cards{position:relative;z-index:3;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-items:stretch}.card{--accent:#16BDEB;position:relative;overflow:hidden;min-height:330px;border-radius:34px;border:1px solid rgba(157,222,255,.22);background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.045));box-shadow:var(--shadow);padding:28px;cursor:pointer;isolation:isolate;display:flex;flex-direction:column;animation:cardIn .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*90ms);transition:transform .28s ease,border-color .28s ease,box-shadow .28s ease}@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.97);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}.card:before{content:"";position:absolute;inset:-1px;background:radial-gradient(circle at 18% 12%,color-mix(in srgb,var(--accent) 55%,transparent),transparent 34%);opacity:.55;z-index:-1;transition:.35s}.card:after{content:"";position:absolute;inset:auto -20% -45% -20%;height:55%;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 35%,transparent),transparent);filter:blur(28px);opacity:.36;transition:.35s}.card:hover,.card:focus-visible{transform:translateY(-8px);border-color:color-mix(in srgb,var(--accent) 70%,white);box-shadow:0 34px 110px rgba(0,0,0,.5),0 0 42px color-mix(in srgb,var(--accent) 32%,transparent);outline:0}.card:hover:before{opacity:.85}.icon{width:72px;height:72px;margin-bottom:20px;color:var(--accent);filter:drop-shadow(0 0 16px color-mix(in srgb,var(--accent) 62%,transparent))}.cardTop{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.num{font-size:16px;font-weight:950;letter-spacing:.18em;color:color-mix(in srgb,var(--accent) 78%,white);opacity:.8}.card h2{margin:0;color:#fff;font-size:clamp(34px,3.6vw,62px);line-height:.92;letter-spacing:-.05em}.card p{color:#C2D8E8;font-size:clamp(17px,1.25vw,23px);line-height:1.32;margin:16px 0 0}.owner{margin-top:14px;color:#8FB7CD;font-size:16px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}.spacer{flex:1}.cardFoot{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:22px}.status{min-height:52px;display:inline-flex;align-items:center;padding:0 18px;border-radius:18px;border:1px solid color-mix(in srgb,var(--accent) 58%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 24%,transparent),rgba(255,255,255,.045));color:#fff;font-size:15px;font-weight:950;letter-spacing:.08em;text-transform:uppercase}.go{min-height:64px;display:inline-flex;align-items:center;justify-content:center;padding:0 24px;border-radius:22px;background:linear-gradient(100deg,var(--accent),color-mix(in srgb,var(--accent) 65%,white));color:#03101d;font-size:20px;font-weight:950;box-shadow:0 18px 50px color-mix(in srgb,var(--accent) 30%,transparent)}.soon .go{background:rgba(255,255,255,.09);border:1px solid color-mix(in srgb,var(--accent) 48%,transparent);color:#DDF8FF}.footer{position:relative;z-index:4;text-align:center;color:rgba(201,229,245,.58);font-size:14px;letter-spacing:.08em;padding-top:16px}@media(max-width:1100px){.cards{grid-template-columns:1fr}.hero{overflow:auto}.card{min-height:270px}html,body{overflow:auto}}
  </style>
</head>
<body>
  <canvas id="network" aria-hidden="true"></canvas><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
  <main class="app">
    <div class="topbar"><div class="brand"><div class="word">CISCO</div><div class="stage">AI Bridge · Cisco Connect Cancún 2026</div></div><button class="lang tap" id="langBtn" aria-label="Toggle language">EN</button></div>
    <section class="hero"><div class="center"><div class="kicker" data-i18n="heroKicker">EL BLUEPRINT DE LA ERA DE LA IA</div><h1>AI Bridge</h1><p class="subtitle" data-i18n="subtitle">Tres blueprints. Un solo puente al futuro de la IA.</p></div><div class="cards" id="cards"></div></section>
    <div class="footer">Cisco AI Bridge · Cisco Connect Cancún 2026 · © Cisco Systems México</div>
  </main>
  <script>
const KEY='cisco.aibridge.lang';
const copy={es:{heroKicker:'EL BLUEPRINT DE LA ERA DE LA IA',subtitle:'Tres blueprints. Un solo puente al futuro de la IA.',enter:'Entrar',soon:'Próximamente',available:'Disponible',statusAvailable:'Disponible',statusSoon:'Próximamente',cards:[{name:'Security',tag:'Asegura la era de la IA — de la red al agente.',status:'Disponible',cta:'Entrar'},{name:'Observability',tag:'Visibilidad total: ITOps, SecOps, AIOps, MLOps.',status:'Disponible',cta:'Entrar'},{name:'Infrastructure',tag:'La base física para la IA: switching, routing, servidores.',status:'Disponible',cta:'Entrar'}]},en:{heroKicker:'THE AI-ERA BLUEPRINT',subtitle:'Three blueprints. One bridge to the AI future.',enter:'Enter',soon:'Coming Soon',available:'Available',statusAvailable:'Available',statusSoon:'Coming Soon',cards:[{name:'Security',tag:'Secure the AI era — from network to agent.',status:'Available',cta:'Enter'},{name:'Observability',tag:'Full visibility: ITOps, SecOps, AIOps, MLOps.',status:'Available',cta:'Enter'},{name:'Infrastructure',tag:'The physical foundation for AI: switching, routing, servers.',status:'Available',cta:'Enter'}]}};
const blueprints=[{accent:'#3070E7',icon:'shield',href:'../security/index.html',soon:false},{accent:'#16BDEB',icon:'observe',href:'../observability/index.html',soon:false},{accent:'#22C55E',icon:'server',href:'../infrastructure/index.html',soon:false}];
let lang=getLang();function getLang(){const p=new URLSearchParams(location.search).get('lang');if(p==='es'||p==='en'){localStorage.setItem(KEY,p);return p}const s=localStorage.getItem(KEY);return s==='en'||s==='es'?s:'es'}
function syncUrl(){const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState(null,'',u)}
function setLang(next){lang=next;localStorage.setItem(KEY,lang);syncUrl();render()}function t(k){return copy[lang][k]}
function icon(name){const common='viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"';const p={shield:'<path d="M32 6l21 8v16c0 14-9 23-21 28C20 53 11 44 11 30V14l21-8z"/><rect x="24" y="29" width="16" height="13" rx="3"/><path d="M27 29v-5a5 5 0 0110 0v5"/>',observe:'<path d="M5 32s10-16 27-16 27 16 27 16-10 16-27 16S5 32 5 32z"/><circle cx="32" cy="32" r="7"/><path d="M18 45l10-10 8 6 12-18"/>',server:'<rect x="12" y="9" width="40" height="13" rx="4"/><rect x="12" y="26" width="40" height="13" rx="4"/><rect x="12" y="43" width="40" height="12" rx="4"/><path d="M21 16h1M21 33h1M21 49h1M32 22v4M32 39v4"/>'};return `<svg class="icon" ${common}>${p[name]}</svg>`}
function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.getElementById('langBtn').textContent=lang==='es'?'EN':'ES';document.getElementById('cards').innerHTML=blueprints.map((b,i)=>{const c=copy[lang].cards[i];const href=`${b.href}?lang=${lang}`;return `<a class="card tap ${b.soon?'soon':''}" style="--accent:${b.accent};--i:${i}" href="${href}" data-link><div class="cardTop"><div>${icon(b.icon)}</div><span class="num">0${i+1}</span></div><h2>${c.name}</h2><p>${c.tag}</p><div class="spacer"></div><div class="cardFoot"><span class="status">${c.status}</span><span class="go">${c.cta}</span></div></a>`}).join('')}
let idleSeconds=0;function resetIdle(){idleSeconds=0}setInterval(()=>{idleSeconds++;if(idleSeconds>120){/* landing is the resting hub; intentionally no redirect */}},1000);document.getElementById('langBtn').addEventListener('click',()=>setLang(lang==='es'?'en':'es'));['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,resetIdle,{passive:true}));
function initCanvas(){const c=document.getElementById('network'),ctx=c.getContext('2d');let w,h,dpr,pts=[];function resize(){dpr=Math.min(devicePixelRatio||1,2);w=c.width=innerWidth*dpr;h=c.height=innerHeight*dpr;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';pts=Array.from({length:Math.min(90,Math.floor(innerWidth/18))},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.34*dpr,vy:(Math.random()-.5)*.34*dpr,r:(Math.random()*2+1)*dpr}))}function tick(){ctx.clearRect(0,0,w,h);for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1}for(let i=0;i<pts.length;i++){for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j],dx=a.x-b.x,dy=a.y-b.y,dist=Math.hypot(dx,dy);if(dist<165*dpr){ctx.globalAlpha=(1-dist/(165*dpr))*.42;ctx.strokeStyle=Math.random()>.7?'#3070E7':'#16BDEB';ctx.lineWidth=1*dpr;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}}for(const p of pts){ctx.globalAlpha=.75;ctx.fillStyle=Math.random()>.66?'#22C55E':(Math.random()>.5?'#16BDEB':'#3070E7');ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}requestAnimationFrame(tick)}addEventListener('resize',resize);resize();tick()}
syncUrl();initCanvas();render();
  </script>
</body>
</html>
